appId: com.youssof.dj-utilities
productName: DJ Utilities
# The audio worker is started with `new Worker(<path>/worker.js)`; keep the app
# unpacked so that path is a real file rather than one inside an asar archive.
asar: false
directories:
  buildResources: build
  output: dist
files:
  - "out/**"
  - "package.json"
# icon.png is read at runtime for the window/dock icon (src/main/index.ts).
extraResources:
  - from: build/icon.png
    to: icon.png
  # Writes cue points into Rekordbox's database (src/main/rekordbox.ts); built by
  # scripts/build-sqlcipher.sh.
  - from: resources/sqlcipher
    to: sqlcipher
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.music
  # Unsigned build. The in-app updater (src/main/updater.ts) swaps the bundle
  # itself, so it doesn't need Squirrel.Mac or a signature.
  identity: null
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
linux:
  icon: build/icon.png
